<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered health symptom triage tool. Analyze symptoms and get risk assessment with hospital recommendations.">
    <meta name="theme-color" content="#0f172a">
    <title>IntentBridge AI - Health Symptom Triage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --focus-ring: 0 0 0 3px rgba(99, 102, 241, 0.5);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .skip-link {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0 0 8px 8px;
            text-decoration: none;
            font-weight: 600;
            z-index: 1000;
            transition: top 0.3s;
        }

        .skip-link:focus {
            top: 0;
            outline: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 1rem;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .container {
                padding: 2rem;
            }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 600px) {
            .glass-panel {
                padding: 2.5rem;
            }
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2rem;
            }
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin: 0 0 2rem 0;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: var(--focus-ring);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        button.btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
        }

        button.btn-primary:focus {
            outline: none;
            box-shadow: var(--focus-ring), 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        button.btn-primary:focus:not(:focus-visible) {
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        button.btn-primary:focus-visible {
            box-shadow: var(--focus-ring);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        button.btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #results-container {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section {
            margin-bottom: 1.5rem;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .symptoms-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .symptom-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .condition-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: #fff;
        }

        .risk-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .risk-low {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .risk-medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .risk-high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            animation: pulse-danger 2s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 var(--danger-glow); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .maps-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--danger);
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
            min-height: 48px;
        }

        .maps-action:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px var(--danger-glow);
        }

        .maps-action:focus {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .maps-action:focus:not(:focus-visible) {
            box-shadow: none;
        }

        .maps-action:focus-visible {
            box-shadow: var(--focus-ring);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        .error-message.visible {
            display: block;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hospital-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .hospital-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
        }

        .hospital-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .hospital-address {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .hospital-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
        }

        .hospital-rating {
            color: #fbbf24;
        }

        .hospital-open {
            color: var(--success);
        }

        .hospital-closed {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="container">
        <main class="glass-panel" id="main-content" role="main" aria-labelledby="page-title">
            <h1 id="page-title">IntentBridge AI</h1>
            <p class="subtitle">AI-Powered Health Symptom Triage</p>

            <div class="input-group">
                <label for="user-input">Describe Your Symptoms</label>
                <textarea 
                    id="user-input" 
                    name="symptoms"
                    placeholder="Describe your situation (e.g., 'My father has severe chest pain and is sweating profusely...')"
                    aria-describedby="input-hint"
                    required
                    minlength="3"
                    maxlength="2000"
                ></textarea>
                <span id="input-hint" class="sr-only">Enter at least 3 characters describing your symptoms</span>
                
                <button id="submit-btn" class="btn-primary" type="button" aria-describedby="btn-status" onclick="analyzeSymptoms()">
                    <span id="btn-text">Analyze Symptoms</span>
                    <span id="btn-loader" class="loader" aria-hidden="true"></span>
                    <span id="btn-status" class="sr-only"></span>
                </button>
            </div>

            <div id="error-container" class="error-message" role="alert" aria-live="assertive"></div>

            <section id="results-container" aria-labelledby="results-heading" hidden>
                <h2 id="results-heading" class="visually-hidden">Analysis Results</h2>
                
                <div class="result-section">
                    <div class="result-label" id="symptoms-label">Extracted Symptoms</div>
                    <div id="symptoms-list" class="symptoms-list" role="list" aria-labelledby="symptoms-label"></div>
                </div>

                <div class="result-section">
                    <div class="result-label" id="condition-label">Possible Condition</div>
                    <div id="condition-text" class="condition-text" aria-labelledby="condition-label"></div>
                </div>

                <div class="result-section">
                    <div class="result-label" id="risk-label">Risk Level</div>
                    <div id="risk-badge" class="risk-badge" role="status" aria-labelledby="risk-label" aria-live="polite"></div>
                </div>

                <div id="hospitals-section" hidden>
                    <div class="result-section">
                        <div class="result-label">Nearby Hospitals</div>
                        <div id="hospitals-list" class="hospital-list" role="list"></div>
                    </div>
                </div>

                <a id="maps-link" href="#" target="_blank" rel="noopener noreferrer" class="maps-action" style="display: none;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Find Nearby Hospitals</span>
                </a>
            </section>
        </main>
    </div>

    <script>
        const inputEl = document.getElementById('user-input');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const btnStatus = document.getElementById('btn-status');
        const errorContainer = document.getElementById('error-container');
        const resultsContainer = document.getElementById('results-container');

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                analyzeSymptoms();
            }
        });

        async function analyzeSymptoms() {
            const text = inputEl.value.trim();
            
            hideError();
            resultsContainer.hidden = true;
            
            if (!text || text.length < 3) {
                showError('Please enter a longer description of your symptoms (at least 3 characters).');
                inputEl.focus();
                return;
            }

            setLoadingState(true, 'Analyzing your symptoms...');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.error || data.detail || 'An unexpected error occurred during analysis.';
                    throw new Error(errorMsg);
                }

                renderResults(data);
                resultsContainer.hidden = false;
                resultsContainer.focus?.();
                
            } catch (err) {
                showError(err.message);
            } finally {
                setLoadingState(false);
            }
        }

        function setLoadingState(loading, status = '') {
            submitBtn.disabled = loading;
            btnText.style.opacity = loading ? '0' : '1';
            btnLoader.style.display = loading ? 'inline-block' : 'none';
            btnStatus.textContent = status;
            inputEl.disabled = loading;
        }

        function renderResults(data) {
            const symptomsList = document.getElementById('symptoms-list');
            const conditionText = document.getElementById('condition-text');
            const riskBadge = document.getElementById('risk-badge');
            const mapsLink = document.getElementById('maps-link');
            const hospitalsSection = document.getElementById('hospitals-section');
            const hospitalsList = document.getElementById('hospitals-list');

            symptomsList.innerHTML = '';
            if (data.extracted_data?.symptoms?.length > 0) {
                data.extracted_data.symptoms.forEach(sym => {
                    const span = document.createElement('span');
                    span.className = 'symptom-tag';
                    span.textContent = sym;
                    span.setAttribute('role', 'listitem');
                    symptomsList.appendChild(span);
                });
                symptomsList.setAttribute('aria-label', `${data.extracted_data.symptoms.length} symptoms detected`);
            } else {
                symptomsList.innerHTML = '<span class="symptom-tag" style="opacity: 0.5;">None detected</span>';
            }

            conditionText.textContent = data.extracted_data?.condition || 'Unknown';

            const risk = (data.risk_level || 'LOW').toUpperCase();
            riskBadge.className = `risk-badge risk-${risk.toLowerCase()}`;
            riskBadge.textContent = `${risk} RISK`;
            riskBadge.setAttribute('aria-label', `Risk level: ${risk}`);

            hospitalsList.innerHTML = '';
            if (data.hospitals?.length > 0) {
                hospitalsSection.hidden = false;
                data.hospitals.forEach(hospital => {
                    const card = document.createElement('div');
                    card.className = 'hospital-card';
                    card.setAttribute('role', 'listitem');
                    card.innerHTML = `
                        <div class="hospital-name">${escapeHtml(hospital.name)}</div>
                        <div class="hospital-address">${escapeHtml(hospital.address)}</div>
                        <div class="hospital-meta">
                            ${hospital.rating ? `<span class="hospital-rating">Rating: ${hospital.rating}/5</span>` : ''}
                            ${hospital.open_now !== null ? `<span class="${hospital.open_now ? 'hospital-open' : 'hospital-closed'}">${hospital.open_now ? 'Open Now' : 'Closed'}</span>` : ''}
                        </div>
                    `;
                    hospitalsList.appendChild(card);
                });
            } else {
                hospitalsSection.hidden = true;
            }

            if (data.maps_link) {
                mapsLink.href = data.maps_link;
                mapsLink.style.display = 'inline-flex';
            } else {
                mapsLink.style.display = 'none';
            }
        }

        function showError(message) {
            errorContainer.textContent = message;
            errorContainer.classList.add('visible');
            errorContainer.setAttribute('aria-live', 'assertive');
        }

        function hideError() {
            errorContainer.classList.remove('visible');
            errorContainer.textContent = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
