<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntentBridge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin: 0 0 2rem 0;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        button.btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        button.btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            position: absolute;
            left: 50%;
            top: 50%;
            margin-top: -10px;
            margin-left: -10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Area */
        #results-container {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section {
            margin-bottom: 1.5rem;
        }

        .result-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .symptoms-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .symptom-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .condition-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: #fff;
        }

        .risk-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .risk-low {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .risk-medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .risk-high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            animation: pulse-danger 2s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 var(--danger-glow); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .maps-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--danger);
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .maps-action:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px var(--danger-glow);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .glass-panel { padding: 1.5rem; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <h1>IntentBridge AI</h1>
            <p class="subtitle">AI-Powered Health Symptom Triage</p>

            <div class="input-group">
                <textarea id="user-input" placeholder="Describe your situation (e.g., 'My father has severe chest pain and is sweating profusely...')"></textarea>
                <button id="submit-btn" class="btn-primary" onclick="analyzeSymptoms()">
                    <span id="btn-text">Analyze Symptoms</span>
                    <span id="btn-loader" class="loader"></span>
                </button>
            </div>

            <div id="error-container" class="error-message"></div>

            <div id="results-container">
                <div class="result-section">
                    <div class="result-label">Extracted Symptoms</div>
                    <div id="symptoms-list" class="symptoms-list"></div>
                </div>

                <div class="result-section">
                    <div class="result-label">Possible Condition</div>
                    <div id="condition-text" class="condition-text"></div>
                </div>

                <div class="result-section">
                    <div class="result-label">Risk Level</div>
                    <div id="risk-badge" class="risk-badge"></div>
                </div>

                <a id="maps-link" href="#" target="_blank" class="maps-action" style="display: none;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Find Nearby Hospitals
                </a>
            </div>
        </div>
    </div>

    <script>
        async function analyzeSymptoms() {
            const inputEl = document.getElementById('user-input');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const errorContainer = document.getElementById('error-container');
            const resultsContainer = document.getElementById('results-container');
            
            const text = inputEl.value.trim();
            
            if (!text || text.length < 3) {
                showError('Please enter a longer description of your symptoms.');
                return;
            }

            // Reset UI
            errorContainer.style.display = 'none';
            resultsContainer.style.display = 'none';
            
            // Loading State
            submitBtn.disabled = true;
            btnText.style.opacity = '0';
            btnLoader.style.display = 'block';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.detail || 'An unexpected error occurred during analysis.');
                }

                renderResults(data);
                
            } catch (err) {
                showError(err.message);
            } finally {
                // Restore Button State
                submitBtn.disabled = false;
                btnText.style.opacity = '1';
                btnLoader.style.display = 'none';
            }
        }

        function renderResults(data) {
            const symptomsList = document.getElementById('symptoms-list');
            const conditionText = document.getElementById('condition-text');
            const riskBadge = document.getElementById('risk-badge');
            const mapsLink = document.getElementById('maps-link');
            const resultsContainer = document.getElementById('results-container');

            // Render Symptoms
            symptomsList.innerHTML = '';
            if (data.extracted_data.symptoms && data.extracted_data.symptoms.length > 0) {
                data.extracted_data.symptoms.forEach(sym => {
                    const span = document.createElement('span');
                    span.className = 'symptom-tag';
                    span.textContent = sym;
                    symptomsList.appendChild(span);
                });
            } else {
                symptomsList.innerHTML = '<span class="symptom-tag" style="opacity: 0.5;">None detected</span>';
            }

            // Render Condition
            conditionText.textContent = data.extracted_data.condition || 'Unknown';

            // Render Risk Level
            const risk = data.risk_level.toUpperCase();
            riskBadge.className = `risk-badge risk-${risk.toLowerCase()}`;
            riskBadge.textContent = risk + ' RISK';

            // Render Maps Link
            if (data.maps_link) {
                mapsLink.href = data.maps_link;
                mapsLink.style.display = 'inline-flex';
            } else {
                mapsLink.style.display = 'none';
            }

            // Show results with animation
            resultsContainer.style.display = 'block';
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            const resultsContainer = document.getElementById('results-container');
            
            // format FastAPI validation errors if it's an array
            if (Array.isArray(message)) {
                message = message[0].msg || 'Input validation failed.';
            }

            errorContainer.textContent = message;
            errorContainer.style.display = 'block';
            resultsContainer.style.display = 'none';
        }
    </script>
</body>
</html>
